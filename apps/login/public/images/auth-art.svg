<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1220"/><stop offset=".55" stop-color="#14233a"/><stop offset="1" stop-color="#1d3350"/></linearGradient>
    <radialGradient id="o1" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b5d9fd"/><stop offset=".35" stop-color="#5980a6"/><stop offset="1" stop-color="#1d2d3d" stop-opacity=".1"/></radialGradient>
    <radialGradient id="o2" cx=".3" cy=".3" r=".9"><stop offset="0" stop-color="#ffd7a8"/><stop offset=".3" stop-color="#f08a4b"/><stop offset=".7" stop-color="#7a3a55"/><stop offset="1" stop-color="#1d2d3d" stop-opacity=".1"/></radialGradient>
    <radialGradient id="o3" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#7fb1ff"/><stop offset=".5" stop-color="#3b5fa8"/><stop offset="1" stop-color="#14233a" stop-opacity=".1"/></radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ebff" stop-opacity=".95"/><stop offset="1" stop-color="#5980a6" stop-opacity=".55"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94bce3" stop-opacity=".9"/><stop offset="1" stop-color="#416180" stop-opacity=".5"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <radialGradient id="bub" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".25" stop-color="#94bce3" stop-opacity=".18"/><stop offset="1" stop-color="#2c455d" stop-opacity=".35"/></radialGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bg)"/>
  <!-- halos -->
  <circle cx="120" cy="120" r="170" fill="url(#o1)" filter="url(#blur40)" opacity=".85"/>
  <circle cx="520" cy="610" r="190" fill="url(#o2)" filter="url(#blur40)" opacity=".7"/>
  <circle cx="470" cy="190" r="140" fill="url(#o3)" filter="url(#blur40)" opacity=".8"/>
  <!-- ondas finas -->
  <g fill="none" stroke="#94bce3" stroke-opacity=".18" stroke-width="1">
    <path d="M-20 520 C 150 430, 260 640, 640 470"/><path d="M-20 540 C 150 450, 260 660, 640 490"/><path d="M-20 560 C 150 470, 260 680, 640 510"/>
    <path d="M-20 580 C 150 490, 260 700, 640 530"/><path d="M-20 600 C 150 510, 260 720, 640 550"/>
  </g>
  <!-- orbes -->
  <circle cx="190" cy="215" r="120" fill="url(#o1)"/>
  <circle cx="470" cy="470" r="105" fill="url(#o2)"/>
  <ellipse cx="150" cy="170" rx="46" ry="28" fill="#fff" opacity=".35" transform="rotate(-30 150 170)" filter="url(#blur6)"/>
  <ellipse cx="440" cy="425" rx="34" ry="20" fill="#fff" opacity=".4" transform="rotate(-30 440 425)" filter="url(#blur6)"/>
  <!-- láminas de vidrio: las capas del logo, la de arriba solo contorno -->
  <g filter="url(#sh)" transform="translate(300 360) rotate(-8) translate(-300 -360)">
    <rect x="130" y="440" width="340" height="86" rx="30" fill="url(#g2)"/>
    <rect x="130" y="440" width="340" height="86" rx="30" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <rect x="130" y="330" width="340" height="86" rx="30" fill="url(#g1)"/>
    <rect x="130" y="330" width="340" height="86" rx="30" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <rect x="134" y="222" width="332" height="80" rx="28" fill="rgba(255,255,255,.06)" stroke="#d6ebff" stroke-opacity=".85" stroke-width="3" stroke-dasharray="16 12"/>
  </g>
  <!-- burbujas -->
  <g>
    <circle cx="505" cy="110" r="26" fill="url(#bub)" stroke="#d6ebff" stroke-opacity=".5"/><circle cx="497" cy="102" r="6" fill="#fff" opacity=".8"/>
    <circle cx="86" cy="560" r="44" fill="url(#bub)" stroke="#d6ebff" stroke-opacity=".45"/><circle cx="72" cy="545" r="9" fill="#fff" opacity=".7"/>
    <circle cx="330" cy="640" r="18" fill="url(#bub)" stroke="#d6ebff" stroke-opacity=".5"/>
    <circle cx="545" cy="330" r="12" fill="url(#bub)" stroke="#d6ebff" stroke-opacity=".5"/>
  </g>
  <circle cx="392" cy="300" r="5" fill="#ffd7a8"/><circle cx="392" cy="300" r="14" fill="#f08a4b" opacity=".35" filter="url(#blur6)"/>
  <circle cx="250" cy="90" r="3.5" fill="#b5d9fd"/>
</svg>
