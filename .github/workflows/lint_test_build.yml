name: Lint Test Build

# CI de este fork (juancadavidc/zitadel, rama brand). El fork solo personaliza el login v2 (apps/login):
# el API sale de la imagen oficial, así que aquí no se prueba ni se construye el backend en Go, ni se
# corren los tests dockerizados del login (levantan un Zitadel completo y no tocan lo que se cambia).
# El original usaba `nx affected`; con un runner de 4 núcleos y un main que no sigue al de upstream eso
# daba por afectado medio monorepo, y un PR que solo toca workflows "pasaba" sin probar nada.

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string

jobs:
  lint_test_build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, Test and Build (login)
        env:
          NX_DAEMON: "false"
          # El fork no tiene workspace de Nx Cloud (nx.json trae el nxCloudId del proyecto original).
          NX_NO_CLOUD: "true"
          NX_DISABLE_DB: "true"
        run: pnpm nx run-many --targets lint-check-prettier lint-check-next test-unit build --projects @zitadel/login --parallel=1
      - name: Check for uncommitted changes (Codegen mismatch)
        run: git diff --exit-code
